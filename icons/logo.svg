<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Soft light pink -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>

    <!-- Ring 1 Gradient: Vibrant Rose/Pink -->
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Center Core Gradient -->
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Gold Accent Sparkle -->
    <linearGradient id="sparkleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Soft Drop Shadow for depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#be185d" flood-opacity="0.18" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Pink Palette -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" stroke="#f472b6" stroke-width="6" stroke-opacity="0.4" />

  <!-- Subtle Inner Target Rings (Precision & Focus) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#f472b6" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="136" fill="white" fill-opacity="0.5" stroke="#f472b6" stroke-width="6" stroke-opacity="0.5" filter="url(#softShadow)" />

  <!-- Target Concentric Ring (Rose Glow) -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="url(#roseGradient)" stroke-width="14" stroke-linecap="round" />

  <!-- The Iconic Psychometry Psi (Ψ) Centerpiece with Sharp Arrowhead / Streak Top -->
  <g filter="url(#softShadow)">
    <!-- Main Vertical Stem / Upward Streak Arrow -->
    <path d="M256 128 L272 168 L262 168 L262 344 C262 347.3 259.3 350 256 350 C252.7 350 250 347.3 250 344 L250 168 L240 168 Z" fill="url(#coreGradient)" />

    <!-- Psi Curved Wings (Cup) -->
    <path d="M184 212 C184 274 216 304 256 304 C296 304 328 274 328 212" fill="none" stroke="url(#coreGradient)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Bullseye Center Sparkle Core -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glowEffect)" />
  <circle cx="256" cy="256" r="8" fill="url(#roseGradient)" />

  <!-- Upper-Right Streak Achievement Sparkle Star (✨) -->
  <g transform="translate(364, 112) scale(1.1)" filter="url(#softShadow)">
    <path d="M0 -32 Q0 0 32 0 Q0 0 0 32 Q0 0 -32 0 Q0 0 0 -32 Z" fill="url(#sparkleGradient)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Lower-Left Subtle Accent Dot -->
  <circle cx="132" cy="380" r="8" fill="#f472b6" fill-opacity="0.6" />
  <circle cx="152" cy="396" r="5" fill="#f472b6" fill-opacity="0.4" />
</svg>
